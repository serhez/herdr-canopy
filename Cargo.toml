[package]
name = "herdr-canopy"
version = "1.0.0"
edition = "2024"
description = "Attention-aware workspace tree and flat agent navigation for Herdr."
license = "MIT"
repository = "https://github.com/serhez/herdr-canopy"
readme = "README.md"

[features]
default = ["mock"]
mock = []

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
fs2 = "0.4"
toml = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[dev-dependencies]
tempfile = "3.27.0"
