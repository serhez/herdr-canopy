id = "serhez.herdr-canopy"
name = "Herdr Canopy"
version = "1.0.0"
description = "Attention-aware tree navigation for workspaces, worktrees, tabs, and agent panes."
min_herdr_version = "0.9.5"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "toggle"
title = "Toggle workspace tree"
contexts = ["global", "workspace"]
command = ["./target/release/herdr-canopy", "toggle"]

[[actions]]
id = "open"
title = "Open workspace tree"
contexts = ["global", "workspace"]
command = ["./target/release/herdr-canopy", "--pane-open"]

[[events]]
on = "workspace.focused"
command = ["./target/release/herdr-canopy", "track"]

[[events]]
on = "tab.focused"
command = ["./target/release/herdr-canopy", "track"]

[[events]]
on = "pane.focused"
command = ["./target/release/herdr-canopy", "track"]

[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/herdr-canopy", "track-work"]

[[events]]
on = "pane.closed"
command = ["./target/release/herdr-canopy", "track-work"]

[[events]]
on = "pane.exited"
command = ["./target/release/herdr-canopy", "track-work"]

[[panes]]
id = "navigator"
title = "Canopy"
placement = "popup"
width = 65
height = 30
command = ["./target/release/herdr-canopy"]
